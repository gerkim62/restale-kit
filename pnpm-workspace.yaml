packages:
  - 'restale-kit'
  - 'snippets'
  - 'examples/shared'
  - 'examples/backend/*'
  - 'examples/frontend/*'
  - 'examples/full-stack-reference'

allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  # helmet 8.3.0 is required by the Express example until its dependency range is updated.
  - helmet@8.3.0
