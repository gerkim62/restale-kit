<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReStale Kit — Vanilla JS Example</title>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
        max-width: 600px;
        margin: 40px auto;
        padding: 0 20px;
      }
      .card {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 8px;
        padding: 20px;
      }
      .status {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: 600;
        background: #334155;
      }
      .status.connected { background: #059669; }
      .status.connecting { background: #d97706; }
      .status.disconnected { background: #dc2626; }
      ul { list-style: none; padding: 0; margin-top: 16px; }
      li { padding: 8px 12px; background: #0f172a; border-radius: 4px; margin-bottom: 8px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Vanilla JS SSE Invalidation</h2>
      <p>Connection status: <span id="status" class="status connecting">connecting</span></p>
      <h3>Received Invalidation Signals:</h3>
      <ul id="signals-list">
        <li>Waiting for invalidations...</li>
      </ul>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
